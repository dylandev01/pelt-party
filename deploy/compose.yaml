services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WATCH_HOSTNAME: ${WATCH_HOSTNAME:?Set WATCH_HOSTNAME in root .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal
volumes:
  caddy_data:
  caddy_config:
networks:
  internal:
    driver: bridge
