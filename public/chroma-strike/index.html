{title:'INTERPHASE',sub:'REPLICATION BREACH',desc:'DNA is duplicated in the S phase of interphase. Stop the errors before they multiply.',goal:8,rate:1.5,mix:['virus','virus','runner'],quiz:['After DNA replication, your model has four duplicated chromosomes. How many sister chromatids are there?',['4','8','16'],1,'Four duplicated chromosomes contain eight sister chromatids.']},
{title:'PROPHASE',sub:'CHROMOSOME STORM',desc:'Chromatin condenses into visible chromosomes as the nuclear envelope breaks down.',goal:10,rate:1.28,mix:['virus','runner','chromosome'],quiz:['What happens to chromatin during prophase?',['It condenses into visible chromosomes','It disappears completely','It becomes four daughter cells'],0,'Chromatin condenses into chromosomes during prophase.']},
{title:'METAPHASE',sub:'THE CENTER LINE',desc:'Duplicated chromosomes line up individually at the middle of the cell in mitosis.',goal:12,rate:1.12,mix:['chromosome','virus','sniper','runner'],quiz:['In mitotic metaphase, the chromosomes line up…',['In two different nuclei','Individually across the cell center','In groups of four daughter cells'],1,'In mitosis, each duplicated chromosome lines up at the metaphase plate.']},

canvas.addEventListener('pointerdown',e=>{if(state!=='playing'||e.pointerType==='touch')return;soundCtx();fireHeld=true;if(!document.pointerLockElement&&canvas.requestPointerLock){try{canvas.requestPointerLock()}catch(err){}}});window.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')fireHeld=false});window.addEventListener('mousemove',e=>{if(state!=='playing')return;if(document.pointerLockElement===canvas||(e.buttons&1)){camYaw+=e.movementX*.0027;camPitch=clamp(camPitch+e.movementY*.0019,-.25,.5)}});document.addEventListener('pointerlockchange',()=>{if(state==='playing'&&!document.pointerLockElement&&document.hasFocus())toast('CLICK ARENA TO RELOCK AIM')});
function stickReset(){joy.active=false;joy.x=0;joy.y=0;joyPointer=-1;$('joyKnob').style.transform='translate(0,0)'}const joyPad=$('joystick');joyPad.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();soundCtx();joyPointer=e.pointerId;joy.active=true;joyPad.setPointerCapture(e.pointerId);stickMove(e)});joyPad.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)stickMove(e)});joyPad.addEventListener('pointerup',stickReset);joyPad.addEventListener('pointercancel',stickReset);function stickMove(e){let rect=joyPad.getBoundingClientRect(),dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2),l=Math.hypot(dx,dy),radius=40,k=Math.min(l,radius)/(l||1);joy.x=dx*k/radius;joy.y=dy*k/radius;$('joyKnob').style.transform=`translate(${dx*k}px,${dy*k}px)`}
const lookzone=$('lookzone');lookzone.addEventListener('pointerdown',e=>{if(state!=='playing')return;touchLook={active:true,id:e.pointerId,x:e.clientX,y:e.clientY};lookzone.setPointerCapture(e.pointerId);e.preventDefault()});lookzone.addEventListener('pointermove',e=>{if(!touchLook.active||e.pointerId!==touchLook.id||state!=='playing')return;camYaw+=(e.clientX-touchLook.x)*.008;camPitch=clamp(camPitch+(e.clientY-touchLook.y)*.0045,-.25,.5);touchLook.x=e.clientX;touchLook.y=e.clientY;e.preventDefault()});lookzone.addEventListener('pointerup',()=>touchLook.active=false);lookzone.addEventListener('pointercancel',()=>touchLook.active=false);
const shoot=$('shootBtn');shoot.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='playing')return;shoot.setPointerCapture(e.pointerId);soundCtx();fireHeld=true});shoot.addEventListener('pointerup',()=>fireHeld=false);shoot.addEventListener('pointercancel',()=>fireHeld=false);$('dashBtn').addEventListener('pointerdown',e=>{e.preventDefault();soundCtx();dash()});$('pulseBtn').addEventListener('pointerdown',e=>{e.preventDefault();soundCtx();pulse()});$('pauseHUD').addEventListener('click',pause);$('pauseMob').addEventListener('click',pause);$('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()});document.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('resize',()=>{deviceMobile=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;if(state==='playing')mobileUI.classList.toggle('active',deviceMobile)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
if(initWebGL()){menu();requestAnimationFrame(loop)}else menu();
